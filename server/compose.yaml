name: commerce-server

services:
  api: &app
    build: &app_build
      context: .
      dockerfile: Dockerfile
      args: &app_build_args
        INSTALL_OBJECT_STORAGE: ${INSTALL_OBJECT_STORAGE:-false}
    restart: unless-stopped
    init: true
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000'
    env_file:
      - path: .env
        required: false
    environment: &app_environment
      DJANGO_SETTINGS_MODULE: codematics.storefront_settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-local-container-secret-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost},api,client
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      TECHNICAL_ADMIN_EMAIL: ${TECHNICAL_ADMIN_EMAIL:-${DEFAULT_ADMIN_EMAIL:-admin@proace.local}}
      TECHNICAL_ADMIN_PASSWORD: ${TECHNICAL_ADMIN_PASSWORD:-${DEFAULT_ADMIN_PASSWORD:-local-technical-admin-change-me}}
      DEFAULT_ADMIN_FIRST_NAME: ${DEFAULT_ADMIN_FIRST_NAME:-}
      DEFAULT_ADMIN_LAST_NAME: ${DEFAULT_ADMIN_LAST_NAME:-}
      DEFAULT_ADMIN_GENDER: ${DEFAULT_ADMIN_GENDER:-}
      DEFAULT_ADMIN_PHONE: ${DEFAULT_ADMIN_PHONE:-}
      DEFAULT_STAFF_EMAIL: ${DEFAULT_STAFF_EMAIL:-}
      DEFAULT_STAFF_PASSWORD: ${DEFAULT_STAFF_PASSWORD:-}
      DEFAULT_STAFF_FIRST_NAME: ${DEFAULT_STAFF_FIRST_NAME:-}
      DEFAULT_STAFF_LAST_NAME: ${DEFAULT_STAFF_LAST_NAME:-}
      DEFAULT_STAFF_GENDER: ${DEFAULT_STAFF_GENDER:-}
      DEFAULT_STAFF_PHONE: ${DEFAULT_STAFF_PHONE:-}
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      DB_REQUIRE_SSL: 'false'
      CACHE_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-false}
      MINIO_ENDPOINT_URL: ${CONTAINER_MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://127.0.0.1:9000}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-commerce-images}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-commerce-media}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-media-change-me}
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-local-observability-token-change-me}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-commerce-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      CELERY_BROKER_URL: redis://redis:6379/1
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:-8}
      NOTIFICATION_DELIVERY_STALE_SECONDS: ${NOTIFICATION_DELIVERY_STALE_SECONDS:-300}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      PUBLISHER_KEY: ${PUBLISHER_KEY:-}
      STRIPE_WALLET_PAYMENT_METHODS: ${STRIPE_WALLET_PAYMENT_METHODS:-cashapp}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_PRODUCTS_INDEX: ${ELASTICSEARCH_PRODUCTS_INDEX:-commerce-products}
      GUNICORN_BIND: 0.0.0.0:8000
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-false}
    volumes:
      - .:/app:cached
      - media-data:/app/media
      - prometheus-multiproc:/tmp/prometheus
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready/', timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  notification-stream:
    <<: *app
    build:
      <<: *app_build
      args:
        <<: *app_build_args
        INSTALL_STREAM_POOL: 'true'
    ports: []
    environment:
      <<: *app_environment
      DJANGO_SETTINGS_MODULE: codematics.stream_settings
      OTEL_SERVICE_NAME: commerce-notification-stream
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost},api,client,notification-stream
      WEB_CONCURRENCY: '${STREAM_WORKERS:-1}'
      GUNICORN_THREADS: '${STREAM_THREADS:-32}'
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-stream
      RUN_MIGRATIONS: 'false'
      RUN_COLLECTSTATIC: 'false'
      ELASTICSEARCH_ENABLED: 'false'
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-worker:
    <<: *app
    ports: []
    environment:
      <<: *app_environment
      RUN_MIGRATIONS: 'false'
      RUN_COLLECTSTATIC: 'false'
      DEFAULT_ADMIN_EMAIL: ''
      DEFAULT_ADMIN_PASSWORD: ''
      DEFAULT_ADMIN_FIRST_NAME: ''
      DEFAULT_ADMIN_LAST_NAME: ''
      DEFAULT_ADMIN_GENDER: ''
      DEFAULT_ADMIN_PHONE: ''
      DEFAULT_STAFF_EMAIL: ''
      DEFAULT_STAFF_PASSWORD: ''
      DEFAULT_STAFF_FIRST_NAME: ''
      DEFAULT_STAFF_LAST_NAME: ''
      DEFAULT_STAFF_GENDER: ''
      DEFAULT_STAFF_PHONE: ''
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    command:
      - celery
      - -A
      - codematics
      - worker
      - --loglevel=INFO
      - --concurrency
      - '${CELERY_WORKER_CONCURRENCY:-2}'

  celery-beat:
    <<: *app
    ports: []
    environment:
      <<: *app_environment
      RUN_MIGRATIONS: 'false'
      RUN_COLLECTSTATIC: 'false'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ['celery', '-A', 'codematics', 'beat', '--loglevel=INFO']

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    ports:
      - '${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT_HOST:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${TECHNICAL_ADMIN_EMAIL:-${DEFAULT_ADMIN_EMAIL:-commerce-admin}}
      MINIO_ROOT_PASSWORD: ${TECHNICAL_ADMIN_PASSWORD:-${DEFAULT_ADMIN_PASSWORD:-local-technical-admin-change-me}}
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${TECHNICAL_ADMIN_EMAIL:-${DEFAULT_ADMIN_EMAIL:-commerce-admin}}
      MINIO_ROOT_PASSWORD: ${TECHNICAL_ADMIN_PASSWORD:-${DEFAULT_ADMIN_PASSWORD:-local-technical-admin-change-me}}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-commerce-images}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-commerce-media}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-media-change-me}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        set -e;
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}";
        mc admin user add local "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" 2>/dev/null || true;
        mc admin policy attach local readwrite --user "$${MINIO_ACCESS_KEY}";
        mc admin policy attach local consoleAdmin --user "$${MINIO_ROOT_USER}" 2>/dev/null || true;
        mc anonymous set none "local/$${MINIO_BUCKET_NAME}";
        mc anonymous set download "local/$${MINIO_BUCKET_NAME}/static";
        mc anonymous set download "local/$${MINIO_BUCKET_NAME}/media/images";
        mc anonymous set download "local/$${MINIO_BUCKET_NAME}/media/store-branding";
        mc anonymous set download "local/$${MINIO_BUCKET_NAME}/media/user-profiles"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - '${ELASTICSEARCH_BIND_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  media-data:
  redis-data:
  postgres-data:
  elasticsearch-data:
  minio-data:
  prometheus-multiproc:

networks:
  default:
    external: true
    name: ${COMMERCE_NETWORK:-commerce-network}
