worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    include trusted-proxies.conf;
    geo $blocked_ip { default 0; include blocked-ips.conf; }
    geo $suspected_ip { default 0; include suspected-ips.conf; }
    geo $allowed_ip { default 0; include allowed-ips.conf; }

    # An explicit block always wins, even for an allowlisted IP.
    map "$suspected_ip:$allowed_ip" $suspect_key {
        default "";
        "1:0" $binary_remote_addr;
    }
    # Allowlisted clients still receive normal request and auth limits.
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $suspect_key zone=suspected:10m rate=1r/s;
    map $uri $auth_key {
        default "";
        ~*^/(api/v1/auth|login|register|token|reset-password)(/|$) $binary_remote_addr;
    }
    limit_req_zone $auth_key zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    map $uri $private_route {
        default 0;
        ~*^/(admin|silk|swagger|redoc|api/docs|api/schema|api/redoc|metrics|health/status)(/|$) 1;
    }
    map "$private_route:$allowed_ip" $private_denied {
        default 0;
        "1:0" 1;
    }
    map $uri $probe {
        default 0;
        ~*(^|/)\.(?!well-known(?:/|$)) 1;
        ~*^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|vendor/phpunit)(/|$) 1;
    }
    map $status $security_event {
        default 0;
        ~^[45] 1;
    }
    map $upstream_http_x_request_id $response_request_id {
        default $upstream_http_x_request_id;
        "" $request_id;
    }
    # Do not log query strings, cookies, authorization headers or request bodies.
    log_format security escape=json
        '{"time":"$time_iso8601","request_id":"$response_request_id",'
        '"client_ip":"$remote_addr","peer_ip":"$realip_remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"blocked":$blocked_ip,"suspected":$suspected_ip,"allowed":$allowed_ip,'
        '"probe":$probe,"private_denied":$private_denied,'
        '"rate_limit":"$limit_req_status","duration":$request_time}';
    access_log /dev/stdout security;
    access_log /dev/stderr security if=$security_event;

    upstream django_backend {
        include upstream.conf;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        add_header X-Request-ID $response_request_id always;
        add_header X-Content-Type-Options nosniff always;

        if ($blocked_ip) { return 403; }
        if ($private_denied) { return 403; }
        if ($probe) { return 403; }

        limit_req zone=general burst=30 nodelay;
        limit_req zone=suspected burst=3 nodelay;
        limit_req zone=auth burst=5 nodelay;
        limit_conn connections 20;

        error_page 403 = @forbidden;
        error_page 429 = @limited;
        error_page 502 503 504 = @unavailable;
        location @forbidden {
            default_type application/json;
            return 403 '{"error":{"code":"forbidden","message":"Access denied."}}';
        }
        location @limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Try again later."}}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"service_unavailable","message":"Service temporarily unavailable."}}';
        }
        location / {
            proxy_hide_header X-Request-ID;
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
