global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: commerce
    metrics_path: /metrics/
    scrape_timeout: 10s
    authorization:
      credentials_file: /run/secrets/metrics-token
    file_sd_configs:
      - files: [/etc/prometheus/targets/app.json]
  - job_name: infrastructure
    file_sd_configs:
      - files: [/etc/prometheus/targets/exporters.json]
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
