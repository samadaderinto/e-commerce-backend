name: commerce-monitoring
services:
  rabbitmq:
    image: rabbitmq:4-management
    profiles: ['messaging']
    restart: unless-stopped
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-commerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me-local}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  kafka:
    image: apache/kafka:3.9.0
    profiles: ['messaging']
    restart: unless-stopped
    ports: ['127.0.0.1:9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka-data:/var/lib/kafka/data
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - /bin/sh
      - -c
      - sed "s|__OBSERVABILITY_TOKEN__|$${OBSERVABILITY_TOKEN}|g" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml && exec prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.retention.time=15d --storage.tsdb.retention.size=5GB
    restart: unless-stopped
    ports: ['127.0.0.1:9090:9090']
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-local-observability-token-change-me}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports: ['127.0.0.1:3002:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
  tempo:
    image: grafana/tempo:2.8.2
    command: ['-config.file=/etc/tempo.yaml']
    restart: unless-stopped
    ports: ['127.0.0.1:4318:4318']
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  loki:
    image: grafana/loki:3.5.3
    command: ['-config.file=/etc/loki/local-config.yaml']
    restart: unless-stopped
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
  alloy:
    image: grafana/alloy:v1.10.2
    command: ['run', '--storage.path=/var/lib/alloy', '/etc/alloy/config.alloy']
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ['linux-host']
    restart: unless-stopped
    pid: host
    command: ['--path.rootfs=/host']
    volumes: ['/:/host:ro,rslave']
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ['postgres']
    restart: unless-stopped
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-}
  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    profiles: ['redis']
    restart: unless-stopped
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:-redis://host.docker.internal:6379}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:-}
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.9.0
    restart: unless-stopped
    extra_hosts: ['host.docker.internal:host-gateway']
    command:
      - --es.uri=${ELASTICSEARCH_EXPORTER_URI:-http://host.docker.internal:9200}
      - --es.all
      - --es.indices
      - --es.shards
    ports: ['127.0.0.1:9114:9114']
volumes:
  rabbitmq-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  alloy-data:
