groups:
  - name: commerce
    rules:
      - alert: CommerceScrapeUnavailable
        expr: up{job="commerce"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Commerce metrics unreachable on {{ $labels.instance }}'
          description: 'Check process health, scrape token, allowed hosts and networking.'
      - alert: CommerceDependencyUnavailable
        expr: commerce_dependency_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.dependency }} is unavailable on {{ $labels.instance }}'
      - alert: CommerceHighErrorRate
        expr: sum(rate(commerce_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(commerce_http_requests_total[5m])), 0.001) > 0.05 and sum(increase(commerce_http_requests_total[5m])) > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'More than 5% of API requests are failing'
      - alert: CommerceSlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(commerce_http_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'API p95 latency exceeds one second'
      - alert: CommerceTailLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(commerce_http_duration_seconds_bucket[5m]))) > 2.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'API p99 latency exceeds 2.5 seconds'
      - alert: CommerceHostDiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Less than 10% disk space remains on {{ $labels.instance }}'
      - alert: CommerceElasticsearchExporterUnavailable
        expr: up{service="elasticsearch"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Elasticsearch exporter is unreachable'
      - alert: CommerceElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Elasticsearch cluster health is red'
      - alert: CommerceElasticsearchHeapHigh
        expr: 100 * elasticsearch_jvm_memory_used_bytes{area="heap"} / elasticsearch_jvm_memory_max_bytes{area="heap"} > 85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Elasticsearch JVM heap is above 85%'
      - alert: CommerceInfrastructureScrapeUnavailable
        expr: up{job="infrastructure"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.service }} metrics are unreachable'
      - alert: CommercePostgresUnavailable
        expr: pg_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 'PostgreSQL exporter cannot connect to the database'
      - alert: CommercePostgresConnectionsHigh
        expr: sum by (instance) (pg_stat_database_numbackends) / on(instance) pg_settings_max_connections > 0.8
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'PostgreSQL connections exceed 80% of the limit'
      - alert: CommercePostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'PostgreSQL deadlocks detected in {{ $labels.datname }}'
      - alert: CommerceRedisUnavailable
        expr: redis_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 'Redis exporter cannot connect to the cache'
      - alert: CommerceRedisMemoryHigh
        expr: (redis_memory_used_bytes / redis_memory_max_bytes > 0.85) and (redis_memory_max_bytes > 0)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Redis memory exceeds 85% of its configured limit'
      - alert: CommerceRedisEvictions
        expr: increase(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Redis is evicting cache entries'
      - alert: CommerceHostCpuHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Docker host CPU exceeds 90%'
      - alert: CommerceHostMemoryHigh
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Docker host memory exceeds 90%'
      - alert: CommerceContainerMemoryHigh
        expr: (container_memory_working_set_bytes{container_label_com_docker_compose_service!=""} / container_spec_memory_limit_bytes > 0.9) and (container_spec_memory_limit_bytes > 0) and (container_spec_memory_limit_bytes < 1e18)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.container_label_com_docker_compose_service }} exceeds 90% of its memory limit'
      - alert: CommerceContainerOom
        expr: increase(container_oom_events_total{container_label_com_docker_compose_service!=""}[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.container_label_com_docker_compose_service }} had an out-of-memory event'
      - alert: CommerceContainerMetricsMissing
        expr: absent(container_last_seen{container_label_com_docker_compose_service="api"})
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'API container metrics are missing from cAdvisor'
          description: 'Check cAdvisor Docker discovery and host mounts, or whether the API container has stopped.'
