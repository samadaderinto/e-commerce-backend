name: commerce-frontend

services:
  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_APPLE_CLIENT_ID: ${NEXT_PUBLIC_APPLE_CLIENT_ID:-}
        MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://127.0.0.1:9000}
        MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-commerce-images}
    restart: unless-stopped
    ports:
      - '${CLIENT_BIND_ADDRESS:-127.0.0.1}:${CLIENT_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: ${CONTAINER_API_URL:-http://api:8000/api/v1}
      NOTIFICATION_STREAM_URL: ${CONTAINER_NOTIFICATION_STREAM_URL:-http://notification-stream:8000/api/v1}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    external: true
    name: ${COMMERCE_NETWORK:-commerce-network}
