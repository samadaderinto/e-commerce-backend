name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.11"
  DJANGO_SETTINGS_MODULE: codematics.test_settings
  SECRET_KEY: ci-only-not-for-production
  SQLITE_DATABASE_PATH: ${{ github.workspace }}/server/storefront.sqlite3
  SQLITE_TEST_DATABASE_PATH: ${{ github.workspace }}/server/test.sqlite3
  PIPENV_VENV_IN_PROJECT: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: server/.venv
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('server/Pipfile') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: pipenv install --dev --skip-lock

      - name: Django system check
        run: pipenv run python manage.py check --settings=codematics.test_settings

      - name: Run tests with coverage
        run: pipenv run coverage run -m pytest --verbose

      - name: Coverage report
        run: pipenv run coverage report --show-missing

      - name: Storefront API integration tests
        run: pipenv run python manage.py test storefront --settings=codematics.storefront_settings --noinput

  frontend:
    name: Next.js Build & Verification
    runs-on: ubuntu-latest
    env:
      API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  security:
    name: Security and Vulnerability Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners and app dependencies
        run: |
          python -m pip install --upgrade pip pipenv bandit pip-audit
          pipenv install --dev --skip-lock

      - name: Audit installed Python packages
        run: pipenv run pip-audit

      - name: Static security scan
        run: bandit -r . -x "./.venv,./*/migrations,./*/tests.py" --severity-level medium

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  deploy:
    name: Deploy to HostGator
    runs-on: ubuntu-latest
    needs:
      - test
      - security
      - codeql
      - frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    env:
      HOSTGATOR_HOST: ${{ secrets.HOSTGATOR_HOST }}
      HOSTGATOR_PORT: ${{ secrets.HOSTGATOR_PORT || '22' }}
      HOSTGATOR_USER: ${{ secrets.HOSTGATOR_USER }}
      HOSTGATOR_DEPLOY_PATH: ${{ secrets.HOSTGATOR_DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HostGator deployment secrets
        env:
          HOSTGATOR_SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
          HOSTGATOR_SSH_KNOWN_HOSTS: ${{ secrets.HOSTGATOR_SSH_KNOWN_HOSTS }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY || secrets.SECRET_KEY }}
        run: |
          required=(
            HOSTGATOR_HOST
            HOSTGATOR_USER
            HOSTGATOR_DEPLOY_PATH
            HOSTGATOR_SSH_PRIVATE_KEY
            HOSTGATOR_SSH_KNOWN_HOSTS
            PROD_SECRET_KEY
          )
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          HOSTGATOR_SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
          HOSTGATOR_SSH_KNOWN_HOSTS: ${{ secrets.HOSTGATOR_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTGATOR_SSH_PRIVATE_KEY" > ~/.ssh/hostgator
          chmod 600 ~/.ssh/hostgator
          printf '%s\n' "$HOSTGATOR_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compose production environment file
        env:
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || 'proaceintlshoppingmall.com' }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY || secrets.SECRET_KEY }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD || secrets.DEFAULT_ADMIN_PASSWORD }}
          PROD_TECHNICAL_ADMIN_PASSWORD: ${{ secrets.PROD_TECHNICAL_ADMIN_PASSWORD || secrets.TECHNICAL_ADMIN_PASSWORD }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL || vars.PROD_ADMIN_EMAIL || 'admin@proaceintl.com' }}
          PROD_OBSERVABILITY_TOKEN: ${{ secrets.PROD_OBSERVABILITY_TOKEN || secrets.OBSERVABILITY_TOKEN }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          PUBLISHER_KEY: ${{ secrets.PUBLISHER_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || vars.RESEND_FROM_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID || vars.APPLE_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID || vars.NEXT_PUBLIC_APPLE_CLIENT_ID }}
          USPS_CLIENT_ID: ${{ secrets.USPS_CLIENT_ID }}
          USPS_CLIENT_SECRET: ${{ secrets.USPS_CLIENT_SECRET }}
          FEDEX_API_KEY: ${{ secrets.FEDEX_API_KEY }}
          FEDEX_SECRET_KEY: ${{ secrets.FEDEX_SECRET_KEY }}
          FEDEX_ACCOUNT_NUMBER: ${{ secrets.FEDEX_ACCOUNT_NUMBER }}
          DHL_API_KEY: ${{ secrets.DHL_API_KEY }}
          DHL_API_SECRET: ${{ secrets.DHL_API_SECRET }}
          UPS_CLIENT_ID: ${{ secrets.UPS_CLIENT_ID }}
          UPS_CLIENT_SECRET: ${{ secrets.UPS_CLIENT_SECRET }}
          UPS_ACCOUNT_NUMBER: ${{ secrets.UPS_ACCOUNT_NUMBER }}
          CLICKBANK_AFFILIATE_NICKNAME: ${{ secrets.CLICKBANK_AFFILIATE_NICKNAME || vars.CLICKBANK_AFFILIATE_NICKNAME }}
          CLICKBANK_SECRET_KEY: ${{ secrets.CLICKBANK_SECRET_KEY }}
          CLICKBANK_DEV_KEY: ${{ secrets.CLICKBANK_DEV_KEY }}
        run: |
          echo "Composing deploy/hostgator/.env strictly from GitHub Secrets and Variables..."
          python3 deploy/hostgator/generate_env.py
          chmod 600 deploy/hostgator/.env

      - name: Upload application and production environment
        run: |
          SSH=(ssh -i ~/.ssh/hostgator -p "$HOSTGATOR_PORT")
          RSYNC_SSH="ssh -i $HOME/.ssh/hostgator -p $HOSTGATOR_PORT"
          "${SSH[@]}" "$HOSTGATOR_USER@$HOSTGATOR_HOST" "mkdir -p '$HOSTGATOR_DEPLOY_PATH'"
          rsync --archive --compress --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --rsh "$RSYNC_SSH" \
            ./ "$HOSTGATOR_USER@$HOSTGATOR_HOST:$HOSTGATOR_DEPLOY_PATH/"
          scp -i ~/.ssh/hostgator -P "$HOSTGATOR_PORT" deploy/hostgator/.env \
            "$HOSTGATOR_USER@$HOSTGATOR_HOST:$HOSTGATOR_DEPLOY_PATH/deploy/hostgator/.env"

      - name: Deploy and verify HostGator stack
        run: |
          ssh -i ~/.ssh/hostgator -p "$HOSTGATOR_PORT" \
            "$HOSTGATOR_USER@$HOSTGATOR_HOST" \
            "cd '$HOSTGATOR_DEPLOY_PATH' && chmod +x deploy/hostgator/deploy.sh deploy/hostgator/backup.sh && deploy/hostgator/deploy.sh"
