name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.11"
  DJANGO_SETTINGS_MODULE: codematics.test_settings
  SECRET_KEY: ci-only-not-for-production
  SQLITE_DATABASE_PATH: ${{ github.workspace }}/server/main.sqlite3
  SQLITE_TEST_DATABASE_PATH: ${{ github.workspace }}/server/test.sqlite3
  PIPENV_VENV_IN_PROJECT: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: server/.venv
          key: ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-${{ hashFiles('server/Pipfile') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: pipenv install --dev --skip-lock

      - name: Django system check
        run: pipenv run python manage.py check --settings=codematics.test_settings

      - name: Run tests with coverage
        run: pipenv run coverage run -m pytest --verbose

      - name: Coverage report
        run: pipenv run coverage report --show-missing

      - name: Storefront API integration tests
        run: pipenv run python manage.py test storefront --settings=codematics.storefront_settings --noinput

  frontend:
    name: Next.js Build
    runs-on: ubuntu-latest
    env:
      API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  security:
    name: Security and Vulnerability Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners and app dependencies
        run: |
          python -m pip install --upgrade pip pipenv bandit pip-audit
          pipenv install --dev --skip-lock

      - name: Audit installed Python packages
        run: pipenv run pip-audit

      - name: Static security scan
        run: bandit -r . -x "./.venv,./*/migrations,./*/tests.py" --severity-level medium

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - test
      - security
      - codeql
      - frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
      RENDER_GRAFANA_SERVICE_ID: ${{ secrets.RENDER_GRAFANA_SERVICE_ID }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_URL: ${{ secrets.PROD_API_URL }}
      DJANGO_SETTINGS_MODULE: codematics.storefront_settings
      DJANGO_DEBUG: "false"
      SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
      ALLOWED_HOSTS: ${{ secrets.PROD_ALLOWED_HOSTS }}
      FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
      DEFAULT_ADMIN_EMAIL: ${{ secrets.PROD_DEFAULT_ADMIN_EMAIL }}
      DEFAULT_ADMIN_PASSWORD: ${{ secrets.PROD_DEFAULT_ADMIN_PASSWORD }}
      DEFAULT_ADMIN_FIRST_NAME: ${{ secrets.PROD_DEFAULT_ADMIN_FIRST_NAME }}
      DEFAULT_ADMIN_LAST_NAME: ${{ secrets.PROD_DEFAULT_ADMIN_LAST_NAME }}
      DEFAULT_ADMIN_GENDER: ${{ secrets.PROD_DEFAULT_ADMIN_GENDER }}
      DEFAULT_ADMIN_PHONE: ${{ secrets.PROD_DEFAULT_ADMIN_PHONE }}
      GF_SECURITY_ADMIN_USER: ${{ secrets.PROD_DEFAULT_ADMIN_EMAIL }}
      GF_SECURITY_ADMIN_EMAIL: ${{ secrets.PROD_DEFAULT_ADMIN_EMAIL }}
      GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.PROD_DEFAULT_ADMIN_PASSWORD }}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: ${{ secrets.PROD_POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.PROD_POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
      DB_REQUIRE_SSL: ${{ secrets.PROD_DB_REQUIRE_SSL || 'true' }}
      CACHE_URL: ${{ secrets.PROD_CACHE_URL }}
      OBSERVABILITY_TOKEN: ${{ secrets.PROD_OBSERVABILITY_TOKEN }}
      OBJECT_STORAGE_ENABLED: ${{ secrets.PROD_OBJECT_STORAGE_ENABLED || 'true' }}
      MINIO_ENDPOINT_URL: ${{ secrets.PROD_S3_ENDPOINT_URL }}
      MINIO_PUBLIC_URL: ${{ secrets.PROD_S3_PUBLIC_URL }}
      MINIO_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
      MINIO_REGION: ${{ secrets.PROD_S3_REGION }}
      MINIO_ACCESS_KEY: ${{ secrets.PROD_S3_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.PROD_S3_SECRET_KEY }}
      OTEL_TRACING_ENABLED: ${{ secrets.PROD_OTEL_TRACING_ENABLED || 'true' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.PROD_OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_SERVICE_NAME: ${{ secrets.PROD_OTEL_SERVICE_NAME || 'commerce-api' }}
      OTEL_TRACES_SAMPLER_ARG: ${{ secrets.PROD_OTEL_TRACES_SAMPLER_ARG || '0.05' }}
      ELASTICSEARCH_ENABLED: ${{ secrets.PROD_ELASTICSEARCH_ENABLED || 'true' }}
      ELASTICSEARCH_URL: ${{ secrets.PROD_ELASTICSEARCH_URL }}
      ELASTICSEARCH_PRODUCTS_INDEX: ${{ secrets.PROD_ELASTICSEARCH_PRODUCTS_INDEX || 'commerce-products' }}
      KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.PROD_KAFKA_BOOTSTRAP_SERVERS }}
      KAFKA_LOGGING_ENABLED: ${{ secrets.PROD_KAFKA_LOGGING_ENABLED || 'false' }}
      KAFKA_LOG_TOPIC: ${{ secrets.PROD_KAFKA_LOG_TOPIC || 'commerce.logs' }}
      CELERY_BROKER_URL: ${{ secrets.PROD_CELERY_BROKER_URL }}
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${{ secrets.PROD_NOTIFICATION_DELIVERY_MAX_ATTEMPTS || '8' }}
      NOTIFICATION_DELIVERY_STALE_SECONDS: ${{ secrets.PROD_NOTIFICATION_DELIVERY_STALE_SECONDS || '300' }}
      RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.PROD_RESEND_FROM_EMAIL }}
      FCM_ENABLED: ${{ secrets.PROD_FCM_ENABLED || 'false' }}
      FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.PROD_FIREBASE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Render deployment secrets
        run: |
          required=(
            RENDER_API_KEY
            RENDER_SERVICE_ID
            RENDER_WORKER_SERVICE_ID
            RENDER_GRAFANA_SERVICE_ID
            RENDER_DEPLOY_HOOK_URL
          )
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate production app secrets
        run: |
          required=(
            API_URL
            SECRET_KEY
            ALLOWED_HOSTS
            FRONTEND_URL
            DEFAULT_ADMIN_EMAIL
            DEFAULT_ADMIN_PASSWORD
            DEFAULT_ADMIN_FIRST_NAME
            DEFAULT_ADMIN_LAST_NAME
            DEFAULT_ADMIN_GENDER
            DEFAULT_ADMIN_PHONE
            POSTGRES_HOST
            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD
            CACHE_URL
            CELERY_BROKER_URL
            OBSERVABILITY_TOKEN
            MINIO_BUCKET_NAME
            MINIO_ACCESS_KEY
            MINIO_SECRET_KEY
            RESEND_API_KEY
            RESEND_FROM_EMAIL
          )
          if [ "${ELASTICSEARCH_ENABLED}" != "false" ]; then
            required+=(ELASTICSEARCH_URL)
          fi
          if [ "${FCM_ENABLED}" = "true" ]; then
            required+=(FIREBASE_PROJECT_ID FIREBASE_CREDENTIALS_JSON)
          fi
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Sync Render environment variables
        run: python .github/scripts/render-sync-env.py

      - name: Trigger Render deploy hook
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_WORKER_SERVICE_ID/deploys"
          curl --fail --show-error --silent \
            --header "Authorization: $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_GRAFANA_SERVICE_ID/deploys"
